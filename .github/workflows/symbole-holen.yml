# Holt die ORIGINAL-Symbole der macOS-Systemeinstellungen (Seitenleiste) als PNG -- fuer die Cloud-OS-Einstellungen
# (Daniel 25.11.2026: "die Symbole sind auch nicht die richtigen SF"). Nur lesen, keine Geheimnisse.
name: Symbole-holen
on:
  workflow_dispatch:
jobs:
  symbole:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Symbole ausziehen
        run: |
          mkdir -p $HOME/aus/png
          cat > $HOME/holen.swift <<'SWIFT'
          import AppKit
          let aus = NSString(string: "~/aus/png").expandingTildeInPath
          var liste: [String] = []
          let orte = ["/System/Library/ExtensionKit/Extensions", "/System/Library/PreferencePanes"]
          for ort in orte {
            guard let namen = try? FileManager.default.contentsOfDirectory(atPath: ort) else { continue }
            for n in namen.sorted() {
              let pfad = ort + "/" + n
              let b = Bundle(path: pfad)
              let info = b?.infoDictionary ?? [:]
              let anzeige = (b?.localizedInfoDictionary?["CFBundleDisplayName"] ?? info["CFBundleDisplayName"] ?? info["CFBundleName"] ?? n) as? String ?? n
              let kennung = (info["CFBundleIdentifier"] as? String) ?? n
              let icon = NSWorkspace.shared.icon(forFile: pfad)
              for px in [64, 128] {
                let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: px, pixelsHigh: px, bitsPerSample: 8,
                  samplesPerPixel: 4, hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0)!
                NSGraphicsContext.saveGraphicsState()
                NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
                icon.draw(in: NSRect(x: 0, y: 0, width: px, height: px))
                NSGraphicsContext.restoreGraphicsState()
                let datei = "\(aus)/\(kennung)@\(px).png"
                try? rep.representation(using: .png, properties: [:])?.write(to: URL(fileURLWithPath: datei))
              }
              liste.append("\(kennung)\t\(anzeige)\t\(pfad)")
            }
          }
          // Programme (Dock-Symbole), hell UND dunkel -- macOS 27 hat je Erscheinungsbild ein eigenes Symbol.
          let progAus = NSString(string: "~/aus/programme").expandingTildeInPath
          try? FileManager.default.createDirectory(atPath: progAus, withIntermediateDirectories: true)
          for ort in ["/System/Applications", "/System/Applications/Utilities", "/System/Library/CoreServices"] {
            guard let namen = try? FileManager.default.contentsOfDirectory(atPath: ort) else { continue }
            for n in namen.sorted() where n.hasSuffix(".app") {
              let pfad = ort + "/" + n
              let icon = NSWorkspace.shared.icon(forFile: pfad)
              for (art, name) in [("hell", NSAppearance.Name.aqua), ("dunkel", NSAppearance.Name.darkAqua)] {
                NSAppearance(named: name)!.performAsCurrentDrawingAppearance {
                  let px = 256
                  let rep = NSBitmapImageRep(bitmapDataPlanes: nil, pixelsWide: px, pixelsHigh: px, bitsPerSample: 8,
                    samplesPerPixel: 4, hasAlpha: true, isPlanar: false, colorSpaceName: .deviceRGB, bytesPerRow: 0, bitsPerPixel: 0)!
                  NSGraphicsContext.saveGraphicsState()
                  NSGraphicsContext.current = NSGraphicsContext(bitmapImageRep: rep)
                  icon.draw(in: NSRect(x: 0, y: 0, width: px, height: px))
                  NSGraphicsContext.restoreGraphicsState()
                  let datei = "\(progAus)/\(n.replacingOccurrences(of: ".app", with: ""))-\(art)@256.png"
                  try? rep.representation(using: .png, properties: [:])?.write(to: URL(fileURLWithPath: datei))
                }
              }
            }
          }
          try? liste.joined(separator: "\n").write(toFile: NSString(string: "~/aus/liste.tsv").expandingTildeInPath, atomically: true, encoding: .utf8)
          print("Symbole:", liste.count)
          SWIFT
          swift $HOME/holen.swift
          sw_vers
          ls $HOME/aus/png | wc -l
      - name: Hochladen
        uses: actions/upload-artifact@v4
        with:
          name: einstellungs-symbole
          path: ~/aus
